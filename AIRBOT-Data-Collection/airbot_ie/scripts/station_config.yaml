# NOTE: The 2 and 4 below refer to the number of robotic arms. During automatic setup,
# the number of robotic arms determines the available camera names.
choices:
  false: # not drag
    2: # 1 * (leader + follower)
      - follow_camera
      - env_camera
    4: # 2 * (leader + follower)
      - left_camera
      - right_camera
      - env_camera
    # - front_camera
    # - top_camera
  true: # drag
    1: # single arm
      - follow_camera
      - env_camera
    2: # left + right arms
      - left_camera
      - right_camera
      - env_camera
    # - front_camera
    # - top_camera
